# ─────────────────────────────────────────────────────────────
# DIB 로컬 개발 환경 (기술스택 문서 버전 기준)
#   시작: docker compose up -d      종료(데이터 유지): docker compose down
#   완전 초기화: docker compose down -v   (스키마는 Flyway가 재생성)
# Spring Boot는 IDE에서 프로필 local 로 직접 실행 (localhost 바라봄)
# ─────────────────────────────────────────────────────────────
services:
  postgres:
    image: pgvector/pgvector:pg18          # PostgreSQL 18 + pgvector (RDS 18.4와 정합)
    container_name: dib-postgres
    environment:
      POSTGRES_DB: auction
      POSTGRES_USER: auction
      POSTGRES_PASSWORD: localdev
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auction -d auction"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.2-alpine                # ElastiCache Redis OSS 7.1과 프로토콜 호환
    container_name: dib-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.1.0              # Kafka 4.x KRaft 단일 브로커 (스택 표의 4.3.x가 태그로 나오면 올릴 것)
    container_name: dib-kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
