# 로컬 개발 — docker compose up -d 로 띄운 컨테이너를 바라본다
# (DB: dib / postgres / 1234 — docker-compose.yml 과 반드시 일치)
spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/dib
    username: postgres
    password: 1234
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
      bootstrap-servers: localhost:9092

      producer:
        key-serializer: org.apache.kafka.common.serialization.StringSerializer
        value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer   # Boot 4 = Jackson 3 (JsonSerializer 는 Jackson 2 용, deprecated)
  flyway:
    locations: classpath:db/migration,classpath:db/seed   # 로컬에서만 더미데이터(V900) 같이 적용
    out-of-order: true
    baseline-on-migrate: true
    # 더미 시드(V900)를 고치면 이미 시드가 들어간 로컬 DB 가 체크섬 불일치로 기동 실패한다. 시드는 고칠 수 있어야 하므로
    # 로컬에서만 검증을 끈다. 진짜 스키마 마이그레이션(db/migration)은 어차피 고치지 않는 것이 원칙이다
    validate-on-migrate: false

jwt:
  secret: local-dev-secret-key-must-be-at-least-256-bits-long-padding-1234
  access-token-validity-seconds: 1800

logging:
  level:
    com.b101.dib: DEBUG
    org.springframework.web.servlet.DispatcherServlet: DEBUG   # 요청마다 GET "/api/v1/..." / Completed 200 한 줄 — 앱 요청이 서버까지 오는지 확인용
    org.springframework.web.socket: DEBUG                      # STOMP CONNECT/SUBSCRIBE 프레임 확인용

livekit:
  url: ${LIVEKIT_URL}
  api-key: ${LIVEKIT_API_KEY}
  api-secret: ${LIVEKIT_API_SECRET}

auth:
  phone-verification:
    hmac-secret: ${PHONE_VERIFICATION_HMAC_SECRET:local-development-secret-change-me}

dib:
  auth:
    header-fallback: true   # Postman / flow_test 가 토큰 없이 X-Member-Id 로 호출
  ai:
    enabled: ${DIB_AI_ENABLED:false}   # AI 서버(uvicorn serve:app --port 8000) 켜고 true 로. 시크릿은 .env 에 AI 와 같은 값으로
    service-hmac-secret: ${DIB_SERVICE_HMAC_SECRET:local-service-hmac}
    ai-hmac-secret: ${DIB_AI_HMAC_SECRET:local-ai-hmac}
