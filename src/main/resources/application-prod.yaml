# 배포(EKS) — 모든 값은 K8s Secret(dib-secrets)이 환경변수로 주입 (BACKEND_CHECKLIST 0)
spring:
  datasource:
    url: ${DB_URL}
    username: auction
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS}

jwt:
  secret: ${JWT_SECRET}
  access-token-validity-seconds: 1800

ai:
  server-url: ${AI_SERVER_URL}
  api-key: ${AI_API_KEY}
