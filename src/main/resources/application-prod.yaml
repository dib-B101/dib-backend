# 배포(EKS) — 모든 값은 K8s Secret(dib-secrets)이 환경변수로 주입 (BACKEND_CHECKLIST 0)
spring:
  datasource:
    url: ${DB_URL}
    username: auction
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS}

jwt:
  secret: ${JWT_SECRET}
  access-token-validity-seconds: 1800

# 라이브 송출(LiveKit). local 프로필에만 있고 여기 없어서 배포에서는 값이 전부 null 이었다 —
# 부팅은 되는데 방송 시작(송출 토큰 발급)에서 터졌다. 비어 있으면 라이브만 꺼진 채로 나머지는 정상 동작
livekit:
  url: ${LIVEKIT_URL:}
  api-key: ${LIVEKIT_API_KEY:}
  api-secret: ${LIVEKIT_API_SECRET:}

dib:
  storage:
    provider: s3   # Pod 가 2~6대로 오르내린다. 로컬 디스크는 여기서 쓸 수 없다
  ai:
    # 온프렘 AI 서버. 이 블록이 없으면 application.yaml 기본값(localhost:8000)이 그대로 남아
    # 배포된 Pod 가 자기 자신을 AI 서버로 찾는다 — 요청이 전부 실패하는데 화면엔 안 보인다
    enabled: ${DIB_AI_ENABLED:false}
    base-url: ${DIB_AI_BASE_URL:}
    # 온프렘 AI 가 결과를 돌려보낼 주소 = ALB. deploy.ps1 이 주소를 찍어준 뒤에 채운다.
    # 상품 이미지도 이 주소로 가져가므로(dib.storage.internal-base-url 기본값) 외부에서 닿아야 한다
    callback-base-url: ${DIB_AI_CALLBACK_BASE_URL:}
