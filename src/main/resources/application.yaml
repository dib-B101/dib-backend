# 공통 설정 — 프로필 무관하게 적용. 접속 정보(url/계정/비번)는 local/prod 프로필에만 둔다.
spring:
  application:
    name: dib
  profiles:
    default: local            # 아무것도 지정 안 하면 로컬 개발 모드
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate      # 스키마는 Flyway가 만든다 — JPA는 검증만
  flyway:
    enabled: true
    locations: classpath:db/migration
  datasource:
    hikari:
      maximum-pool-size: 10   # Pod 6개 x 10 = 60 커넥션, RDS 한도 고려 (BACKEND_CHECKLIST 8)

# CQRS Query 측 — MyBatis 매퍼 XML 위치
mybatis:
  mapper-locations: classpath:/mappers/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080                  # 인프라 계약: 컨테이너 포트 8080
  shutdown: graceful          # scale-in 시 WebSocket/요청 정리 (BACKEND_CHECKLIST 6)

management:
  endpoint:
    health:
      probes:
        enabled: true         # /actuator/health/liveness, /readiness 활성화
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
