# 공통 설정 — 프로필 무관하게 적용. 접속 정보(url/계정/비번)는 local/prod 프로필에만 둔다.
spring:
  application:
    name: dib
  profiles:
    default: local            # 아무것도 지정 안 하면 로컬 개발 모드
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate      # 스키마는 Flyway가 만든다 — JPA는 검증만
  flyway:
    enabled: true
    locations: classpath:db/migration
  datasource:
    hikari:
      maximum-pool-size: 10   # Pod 6개 x 10 = 60 커넥션, RDS 한도 고려 (BACKEND_CHECKLIST 8)
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 110MB
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer   # Boot 4 = Jackson 3. JsonSerializer(Jackson 2) 는 4.0 부터 deprecated
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer   # Consumer 가 EventEnvelope 로 직접 파싱
      auto-offset-reset: earliest

# CQRS Query 측 — MyBatis 매퍼 XML 위치
mybatis:
  mapper-locations: classpath:/mappers/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080                  # 인프라 계약: 컨테이너 포트 8080
  shutdown: graceful          # scale-in 시 WebSocket/요청 정리 (BACKEND_CHECKLIST 6)

management:
  endpoint:
    health:
      probes:
        enabled: true         # /actuator/health/liveness, /readiness 활성화
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

jwt:
  refresh-token-inactivity: 30d
  refresh-token-absolute: 90d

auth:
  phone-verification:
    otp-ttl: 3m
    verification-ttl: 10m
    resend-delay: 60s
    rate-window: 1h
    max-requests-per-window: 5
    max-attempts: 5
    hmac-secret: ${PHONE_VERIFICATION_HMAC_SECRET}
  password-reset:
    token-ttl: 30m
    reset-page-url: ${PASSWORD_RESET_PAGE_URL:http://localhost:5173/password/reset}
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    token-url: https://kauth.kakao.com/oauth/token
    user-info-url: https://kapi.kakao.com/v2/user/me
    signup-token-ttl: 10m
    redirect-uris: ${KAKAO_REDIRECT_URIS:}

# TossPayments 자동결제(빌링). 키는 프로필/환경변수에서 — 없으면 결제 호출 시점에만 실패
toss:
  secret-key: ${TOSS_SECRET_KEY:}
  base-url: https://api.tosspayments.com

# 정산 수수료율 (판매가 대비). 팀 합의 값
dib:
  auth:
    header-fallback: false   # true 면 토큰 없이 X-Member-Id 헤더만으로 인증 (local 전용)
  settlement:
    commission-rate: 0.05
  order:
    auto-confirm-days: 5   # 배송완료 후 구매확정 없으면 자동 확정
  outbox:
    poll-ms: 500           # outbox_event → Kafka 발행 주기
    batch-size: 100
  realtime:
    redis-enabled: true    # 소켓 브로드캐스트를 Redis Pub/Sub 으로 모든 Pod 에 전파. false 면 이 Pod 에만 직접 전송
  lock:
    redis-enabled: true    # 경매 단위 Redisson 분산락 lock:auction:{id}. false 면 DB 행 락만
  cache:
    snapshot-enabled: true # 입찰 스냅샷 Redis Hot State auction:{id}:snapshot
  storage:
    product-image-dir: ${DIB_PRODUCT_IMAGE_DIR:./data/product-images}
    internal-base-url: ${DIB_STORAGE_INTERNAL_BASE_URL:${DIB_AI_CALLBACK_BASE_URL:http://localhost:8080}}
  ai:
    enabled: ${DIB_AI_ENABLED:false}                 # true 면 이상입찰 분석 + 상품 등록·수정 시 AI 검수 요청. false 면 등록 즉시 REGISTERED + 경매 생성(기존 동작)
    moderation-enabled: ${DIB_AI_MODERATION_ENABLED:false} # 검수 모델 운영 전에는 false: 상품은 즉시 승인하되 추천·이상입찰 AI는 유지
    base-url: ${DIB_AI_BASE_URL:http://localhost:8000}
    callback-base-url: ${DIB_AI_CALLBACK_BASE_URL:http://localhost:8080}
    service-hmac-secret: ${DIB_SERVICE_HMAC_SECRET:}  # AI 의 DIB_SERVICE_HMAC_SECRET 과 같은 값
    ai-hmac-secret: ${DIB_AI_HMAC_SECRET:}            # AI 의 DIB_AI_HMAC_SECRET 과 같은 값
    max-skew-seconds: 300
    recommendation-cache-ttl: 5m
    recommendation-refresh-lock-ttl: 30s
    recommendation-initial-delay-ms: 2000
    recommendation-refresh-ms: 240000

# 배송 조회 구현체 선택: fake(기본, devtools.FakeCarrierClient) | deliverytracker | sweettracker
carrier:
  provider: ${CARRIER_PROVIDER:fake}
  cache-seconds: 300      # 같은 송장 재조회 캐시 (외부 API 쿼터 보호)
  deliverytracker:
    client-id: ${DELIVERY_TRACKER_CLIENT_ID:}
    client-secret: ${DELIVERY_TRACKER_CLIENT_SECRET:}
  sweettracker:
    key: ${SWEETTRACKER_KEY:}
