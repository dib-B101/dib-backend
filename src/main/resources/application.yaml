spring:
  application:
    name: dib

  datasource:
    url: jdbc:postgresql://localhost:5432/dib
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

mybatis:
  mapper-locations: classpath:/mappers/**/*.xml